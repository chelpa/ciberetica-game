<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Influencer: El Costo de la Fama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0714; --panel:#160f2b; --panel-2:#1e1440; --line: rgba(255,255,255,0.08);
    --magenta:#ff2e7e; --cyan:#2bd9f0; --gold:#f4c24b; --pos:#49e08b; --neg:#fb5b6b; --purple:#8a4fd1;
    --cream:#f3ecdc; --ink:#efe9ff; --ink-dim:#9c8fc2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background: radial-gradient(1200px 800px at 50% -10%, #241546 0%, var(--void) 55%), var(--void); color:var(--ink); font-family:'Manrope', sans-serif; min-height:100vh; }
  h1,h2,h3,.display{ font-family:'Archivo Black', sans-serif; letter-spacing:0.5px; }
  .mono{ font-family:'Space Mono', monospace; }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-badge{ width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg, var(--magenta), var(--cyan)); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .brand-title{ font-size:13px; line-height:1.2; } .brand-title span{ color:var(--magenta); }
  .round-badge{ font-family:'Space Mono'; font-size:11px; color:var(--gold); border:1px solid var(--gold); border-radius:20px; padding:4px 10px; }
  .info-btn{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; }

  .setup-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
  .setup-card{ background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:36px; max-width:540px; width:100%; }
  .setup-card h1{ font-size:25px; margin:0 0 6px 0; }
  .setup-card h1 .g{ background:linear-gradient(90deg, var(--magenta), var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .setup-sub{ color:var(--ink-dim); font-size:13px; margin-bottom:20px; }
  .name-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .seat-swatch{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .name-row input{ flex:1; background:var(--void); border:1px solid var(--line); color:var(--ink); padding:11px 14px; border-radius:10px; font-size:14px; }
  .mode-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .mode-btn{ flex:1; min-width:140px; background:var(--void); border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; text-align:left; color:var(--ink); }
  .mode-btn.selected{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .mode-btn b{ display:block; font-size:13px; margin-bottom:3px; }
  .mode-btn span{ font-size:10.5px; color:var(--ink-dim); font-family:'Space Mono'; }
  .start-btn{ width:100%; margin-top:6px; padding:14px; border:none; border-radius:12px; background:linear-gradient(90deg, var(--magenta), #d81f66); color:white; font-family:'Archivo Black'; font-size:14px; cursor:pointer; }
  .rules-box{ background:var(--void); border:1px dashed var(--line); border-radius:12px; padding:14px 16px; font-size:11.5px; color:var(--ink-dim); margin-top:18px; line-height:1.6; max-height:280px; overflow-y:auto; }
  .rules-box b{ color:var(--ink); }
  .rules-box .sec{ color:var(--gold); font-family:'Space Mono'; font-size:10px; letter-spacing:1px; margin-top:10px; display:block; }

  .table-wrap{ flex:1; padding:14px; }
  .grid{ display:grid; gap:12px; max-width:1080px; margin:0 auto; grid-template-columns:1fr 1.6fr 1fr; grid-template-rows:auto auto auto; grid-template-areas:". top ." "left stage right" ". bottom ."; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; grid-template-areas:"top" "left" "stage" "right" "bottom"; } }
  .seat-top{grid-area:top;} .seat-left{grid-area:left;} .seat-right{grid-area:right;} .seat-bottom{grid-area:bottom;}
  .stage{ grid-area:stage; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:10px; padding:4px 0; }

  .seat{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:11px; }
  .seat.human{ border:2px solid var(--cyan); padding:16px; }
  .seat.out{ opacity:.35; filter:grayscale(1); }
  .seat.won{ border-color:var(--gold); box-shadow:0 0 24px rgba(244,194,75,.3); }
  .seat-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .seat-name{ font-size:13px; font-weight:800; display:flex; align-items:center; gap:6px; }
  .seat.human .seat-name{ font-size:15px; }
  .stat-line{ display:flex; align-items:center; justify-content:space-between; font-size:11px; }
  .seat.human .stat-line{ font-size:13px; }
  .stat-label{ color:var(--ink-dim); }
  .led{ font-family:'Space Mono'; font-weight:700; color:var(--cream); }
  .bar{ height:5px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:2px; }
  .bar-fill{ height:100%; border-radius:4px; }
  .hand-row{ display:flex; gap:6px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .facedown-row{ display:flex; gap:6px; justify-content:center; margin-top:6px; }
  .facedown-label{ font-size:9px; font-family:'Space Mono'; color:var(--ink-dim); text-align:center; margin-top:4px; }
  .flag-row{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .flag-chip{ font-size:8.5px; font-family:'Space Mono'; background:rgba(244,194,75,.12); color:var(--gold); border-radius:10px; padding:2px 7px; }
  .turn-counter{ text-align:center; font-family:'Space Mono'; font-size:11px; color:var(--gold); margin-top:8px; }
  .end-turn-btn{ width:100%; margin-top:8px; background:var(--panel-2); border:1px solid var(--cyan); color:var(--cyan); border-radius:10px; padding:8px; font-size:12px; cursor:pointer; font-family:'Manrope'; font-weight:700; }

  .acard{ width:78px; min-height:108px; border-radius:10px; background:linear-gradient(160deg,#fbf6ea,#ecdfc4); color:#241a10; padding:6px 5px; display:flex; flex-direction:column; align-items:center; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.3); border:2px solid var(--ac,#999); flex-shrink:0; cursor:pointer; transition:transform .12s; }
  .acard:hover{ transform:translateY(-3px); }
  .acard.disabled{ opacity:.35; cursor:not-allowed; }
  .acard.disabled:hover{ transform:none; }
  .acard.xl{ width:120px; min-height:164px; padding:10px 8px; }
  .acard.mini{ width:50px; min-height:70px; padding:4px 3px; border-radius:7px; cursor:default; }
  .acard.preview{ width:170px; min-height:230px; padding:16px 12px; cursor:default; margin:0 auto; }
  .acard-icon{ width:44px; height:32px; margin-top:2px; }
  .acard.xl .acard-icon{ width:66px; height:48px; }
  .acard.preview .acard-icon{ width:120px; height:88px; }
  .acard.mini .acard-icon{ width:26px; height:19px; margin-top:1px; }
  .acard-icon svg{ width:100%; height:100%; display:block; }
  .acard-name{ font-size:8px; font-weight:800; margin-top:4px; line-height:1.2; }
  .acard.xl .acard-name{ font-size:10.5px; }
  .acard.preview .acard-name{ font-size:14px; margin-top:8px; }
  .acard.mini .acard-name{ font-size:5.5px; margin-top:2px; line-height:1.05; }
  .acard-cat{ font-size:6.5px; font-family:'Space Mono'; color:var(--ac,#999); margin-top:1px; text-transform:uppercase; }
  .acard.mini .acard-cat{ display:none; }
  .acard.preview .acard-cat{ font-size:10px; margin-top:2px; }
  .aback{ width:78px; height:108px; border-radius:10px; background:linear-gradient(150deg,#2f1a5c,#170b30); border:2px solid rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; cursor:pointer; }
  .aback.mini{ width:50px; height:70px; border-radius:7px; font-size:13px; }
  .aback:hover{ transform:translateY(-2px); }
  .aback.variant-hand{ border-color:rgba(43,217,240,.4); background:linear-gradient(150deg,#1a2f52,#0b1830); }
  .aback.variant-facedown{ border-color:var(--gold); background:linear-gradient(150deg,#3a2a10,#1f1608); box-shadow:0 0 10px rgba(244,194,75,.25); }
  .hand-label{ font-size:9px; font-family:'Space Mono'; color:var(--ink-dim); text-align:center; margin-top:6px; }

  .ecard{ margin:10px auto; width:230px; border-radius:16px; background:linear-gradient(160deg,#2a1140,#170a28); border:2px solid var(--gold); padding:16px; text-align:center; }
  .ecard .eyebrow{ font-family:'Space Mono'; font-size:10px; color:var(--gold); letter-spacing:2px; }
  .ecard .icon{ width:90px; height:66px; margin:8px auto; }
  .ecard .icon svg{ width:100%; height:100%; display:block; }
  .ecard h3{ margin:4px 0; font-size:15px; }
  .ecard p{ font-size:11.5px; color:var(--ink-dim); line-height:1.5; margin:0; }
  .event-banner{ display:flex; align-items:center; gap:10px; background:var(--panel-2); border:1px solid var(--gold); border-radius:12px; padding:8px 14px; font-size:11px; max-width:480px; margin:0 auto; }
  .event-banner-icon{ width:34px; height:25px; flex-shrink:0; }
  .event-banner-icon svg{ width:100%; height:100%; display:block; }

  .mesa{ background:radial-gradient(ellipse at center, rgba(244,194,75,0.10), rgba(244,194,75,0.02)); border:2px solid var(--gold); border-radius:32px; padding:16px 20px; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:240px; }
  .mesa-die{ font-size:44px; line-height:1; filter:drop-shadow(0 0 10px rgba(244,194,75,.5)); }
  .mesa-die-label{ font-family:'Space Mono'; font-size:9px; color:var(--ink-dim); letter-spacing:1px; text-align:center; }

  .overlay{ position:fixed; inset:0; background:rgba(5,2,12,.85); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:14px; }
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px; max-width:480px; width:100%; text-align:center; max-height:90vh; overflow-y:auto; }
  .modal .eyebrow{ font-family:'Space Mono'; font-size:11px; letter-spacing:2px; color:var(--gold); }
  .modal h2{ font-size:18px; margin:8px 0; }
  .modal p{ color:var(--ink-dim); font-size:12.5px; line-height:1.55; }
  .choice-btn{ display:block; width:100%; text-align:left; background:var(--void); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:10px; cursor:pointer; color:var(--ink); }
  .choice-btn:hover{ border-color:var(--cyan); }
  .choice-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .choice-btn .c-label{ font-weight:800; font-size:13px; }
  .choice-btn .c-effects{ font-family:'Space Mono'; font-size:10.5px; margin-top:4px; color:var(--ink-dim); }
  .target-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; justify-content:center; }
  .target-btn{ background:var(--panel-2); border:1px solid var(--cyan); color:var(--ink); border-radius:12px; padding:7px 13px; font-size:11.5px; cursor:pointer; }
  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--cyan); padding:10px 18px; border-radius:20px; font-size:12px; z-index:60; font-family:'Space Mono'; max-width:92vw; text-align:center; }
  .modal-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .modal-actions .start-btn{ flex:1; min-width:150px; margin-top:0; }
  .cancel-btn{ background:transparent; border:1px solid var(--line); color:var(--ink-dim); }
  .down-btn{ background:var(--panel-2); border:1px solid var(--purple); color:var(--purple); }
  .result-log{ background:var(--void); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-top:10px; text-align:left; font-family:'Space Mono'; font-size:11px; line-height:1.7; color:var(--ink-dim); }
  .wc-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin:14px 0; }
  .wc-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--void); color:var(--ink); font-size:16px; cursor:pointer; }
  .final-list{ text-align:left; margin:14px 0; display:flex; flex-direction:column; gap:8px; }
  .final-row{ display:flex; align-items:center; justify-content:space-between; background:var(--void); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .final-row.rank1{ border-color:var(--gold); }
  .medal{ font-size:16px; margin-right:8px; }
</style>
</head>

<div id="app"></div>

const MODES = {
  corta: { label:'Corta', rounds:5, blue:3, black:3, white:0, goal:20 },
  media: { label:'Media', rounds:9, blue:5, black:5, white:0, goal:30 },
  larga: { label:'Larga', rounds:13, blue:5, black:5, white:2, goal:45 },
};

const SEAT_COLORS = ['#2bd9f0','#ff2e7e','#f4c24b','#49e08b'];
const HUMAN_INDEX = 0;
const DIE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];

/* ============================ ESTADO ============================ */
let state = null;
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtSigned(n){ return (n>0?'+':'') + n; }
function rollDie(){ return 1 + Math.floor(Math.random()*6); }
function pushLog(msg){ state.roundLog.push(msg); }

function buildActionDeck(){
  const deck = [];
  Object.keys(CARD_DEFS).forEach(key=>{
    for(let i=0;i<4;i++){ deck.push({ key, uid: Math.random().toString(36).slice(2) }); }
  });
  return shuffle(deck);
}
function drawCard(){
  if(state.deck.length===0){
    if(state.discard.length===0) return null;
    state.deck = shuffle(state.discard);
    state.discard = [];
  }
  return state.deck.pop();
}
function refillHand(p){
  while(p.hand.length < 5){
    const c = drawCard();
    if(!c) break;
    p.hand.push(c);
  }
}

/* ============================ SETUP ============================ */
function startMatch(humanName, modeKey){
  const mode = MODES[modeKey];
  const names = [humanName||'Tú', 'Ana (IA)', 'Beto (IA)', 'Cami (IA)'];
  state = {
    screen:'table', modeKey, mode,
    players: names.map((n,i)=>({
      id:i, name:n, isAI:i!==HUMAN_INDEX, color:SEAT_COLORS[i],
      seguidores: mode.blue, etica: mode.black, hand:[], faceDown:[],
      flags:{ halfNextCard:false }, bustedOut:false, won:false, lastPlayed:null, deudaAnonima:0,
    })),
    deck: buildActionDeck(), discard:[],
    round:0, phase:'PRE', roundLog:[], roundFlags:{}, toast:null,
    turnActionsUsed:0, previewCard:null, targetPick:null, faceDownActivate:null,
    diceResult:null, defensePrompt:null, wildcardPick:null,
    aiTurnQueue:[], winnerInfo:null,
  };
  state.players.forEach(p=>{ for(let i=0;i<6;i++){ const c=drawCard(); if(c) p.hand.push(c); } });
  // fichas blancas iniciales (modo Larga): repartidas automáticamente mitad/mitad para no interrumpir el inicio
  state.players.forEach(p=>{
    if(mode.white){
      const toSeg = Math.ceil(mode.white/2), toEt = mode.white - toSeg;
      p.seguidores += toSeg; p.etica += toEt;
    }
    p.ethicsTier = getEthicsTier(p.etica);
  });
  startRound();
}

function activePlayers(){ return state.players.filter(p=>!p.bustedOut && !p.won); }

function startRound(){
  if(state.round >= state.mode.rounds){ return endMatch('rounds'); }
  state.round++;
  state.roundLog = [];
  state.roundFlags = {};
  state.turnActionsUsed = 0;
  state.players.forEach(p=>{ p.lastPlayed = null; });
  if(state.round===1 || (state.round-1)%2===0){
    state.activeEvent = EVENTS[Math.floor(Math.random()*EVENTS.length)];
    applyEvent(state.activeEvent);
  } else {
    state.activeEvent = null;
  }
  if(checkWinLoss()) return;
  state.phase = state.activeEvent ? 'EVENT_REVEAL' : 'HUMAN_TURN';
  render();
}
function continueAfterEvent(){ state.phase='HUMAN_TURN'; render(); }

/* ============================ EVENTOS ============================ */
function wildcardGrant(player, n, cb){
  if(!n){ if(cb) cb(); return; }
  if(player.isAI){
    const toSeg = Math.round(Math.random()*n);
    player.seguidores += toSeg; player.etica += (n-toSeg);
    pushLog(player.name+': repartió '+n+' fichas blancas ('+toSeg+' seguidores, '+(n-toSeg)+' ética)');
    if(cb) cb();
    return;
  }
  state.wildcardPick = { n, seg: Math.ceil(n/2), player, cb };
}
function adjustWildcardPick(delta){
  const w = state.wildcardPick;
  const next = w.seg + delta;
  if(next<0 || next>w.n) return;
  w.seg = next;
  render();
}
function confirmWildcardPick(){
  const w = state.wildcardPick;
  w.player.seguidores += w.seg;
  w.player.etica += (w.n - w.seg);
  pushLog(w.player.name+': repartió '+w.n+' fichas blancas ('+w.seg+' seguidores, '+(w.n-w.seg)+' ética)');
  state.wildcardPick = null;
  if(w.cb) w.cb();
  render();
}

function applyEvent(ev){
  const all = activePlayers();
  if(ev.key==='algoritmo'){
    const maxE = Math.max(...all.map(p=>p.etica));
    const tied = all.filter(p=>p.etica===maxE);
    const safe = tied.length>1 ? tied[Math.floor(Math.random()*tied.length)] : tied[0];
    all.forEach(p=>{ if(p!==safe){ p.seguidores=Math.max(0,p.seguidores-2); pushLog(p.name+': -2 seguidores (Nuevo Algoritmo)'); } });
    if(tied.length>1) pushLog(safe.name+' se salvó al azar por el empate de ética.');
  } else if(ev.key==='viral'){
    const minS = Math.min(...all.map(p=>p.seguidores));
    all.forEach(p=>{ if(p.seguidores===minS){ p.seguidores+=4; pushLog(p.name+': +4 seguidores (Viral Inesperado)'); } });
  } else if(ev.key==='auditoria'){
    all.forEach(p=>{ if(p.faceDown.length){ const c=p.faceDown[0]; pushLog('Se reveló que '+p.name+' tiene boca abajo: '+CARD_DEFS[c.key].name); } });
  } else if(ev.key==='caida'){
    state.roundFlags.noAttacks = true;
  } else if(ev.key==='diasinalgoritmo'){
    all.forEach(p=>{ p.etica+=2; }); pushLog('Todos ganan +2 ética (Día sin Algoritmo).');
  } else if(ev.key==='escandalo'){
    const maxS = Math.max(...all.map(p=>p.seguidores));
    all.forEach(p=>{ if(p.seguidores===maxS){ p.etica=Math.max(0,p.etica-4); pushLog(p.name+': -4 ética (Escándalo Mediático)'); } });
  } else if(ev.key==='tendencia'){
    all.forEach(p=> wildcardGrant(p, 2));
  } else if(ev.key==='terminos'){
    all.forEach(p=>{
      if(p.isAI){
        if(p.seguidores>p.etica){ p.seguidores=Math.max(0,p.seguidores-2); pushLog(p.name+' eligió perder 2 seguidores (Cambio de Términos)'); }
        else { p.etica=Math.max(0,p.etica-2); pushLog(p.name+' eligió perder 2 ética (Cambio de Términos)'); }
      }
    });
    const human = state.players[HUMAN_INDEX];
    if(!human.bustedOut && !human.won) state.termsChoicePending = true;
  } else if(ev.key==='transparencia'){
    state.roundFlags.comunidadDouble = true;
  } else if(ev.key==='bloqueo'){
    const minE = Math.min(...all.map(p=>p.etica));
    all.forEach(p=>{ if(p.etica===minE){ p.seguidores=Math.max(0,p.seguidores-2); pushLog(p.name+': -2 seguidores (Bloqueo Regional)'); } });
  } else if(ev.key==='colapso'){
    all.forEach(p=>{ p.seguidores=Math.max(0,p.seguidores-2); }); pushLog('Todos pierden 2 seguidores (Colapso de Servidores).');
  } else if(ev.key==='solidario'){
    all.forEach(p=>{ if(p.etica<6) wildcardGrant(p, 2); });
  } else if(ev.key==='filtracionmasiva'){
    all.forEach(p=>{ p.etica=Math.max(0,p.etica-2); }); pushLog('Todos pierden 2 ética (Filtración Masiva).');
  } else if(ev.key==='nuevoinfluencer'){
    const minS = Math.min(...all.map(p=>p.seguidores));
    all.forEach(p=>{ if(p.seguidores===minS){ const c=drawCard(); if(c){ p.hand.push(c); pushLog(p.name+' robó una carta extra (Nuevo Influencer).'); } } });
  } else if(ev.key==='leyproteccion'){
    state.roundFlags.blockedCard = 'filtracion';
  } else if(ev.key==='retoviral'){
    state.roundFlags.comunidadBonus = true;
  } else if(ev.key==='hackeo'){
    const victim = all[Math.floor(Math.random()*all.length)];
    victim.seguidores=Math.max(0,victim.seguidores-2); victim.etica=Math.max(0,victim.etica-2);
    pushLog(victim.name+': -2 seguidores y -2 ética (Cuenta Hackeada al Azar)');
  } else if(ev.key==='boicot'){
    all.forEach(p=>{ if(p.etica<4){ p.seguidores=Math.max(0,p.seguidores-2); pushLog(p.name+': -2 seguidores (Boicot de Marcas)'); } });
  } else if(ev.key==='reconocimiento'){
    const maxE = Math.max(...all.map(p=>p.etica));
    all.forEach(p=>{ if(p.etica===maxE) wildcardGrant(p, 4); });
  } else if(ev.key==='anonimato'){
    all.forEach(p=>{
      if(p.deudaAnonima && p.deudaAnonima>0){
        const pay = Math.ceil(p.deudaAnonima/2);
        const before = p.etica;
        p.etica = Math.max(0, p.etica-pay);
        const applied = before - p.etica;
        p.deudaAnonima = 0;
        pushLog('🎭 '+p.name+' paga '+applied+' ética por su deuda anónima (Fin del Anonimato).');
      }
    });
  }
}
function resolveTermsChoice(loseWhat){
  const human = state.players[HUMAN_INDEX];
  if(loseWhat==='seguidores'){ human.seguidores=Math.max(0,human.seguidores-2); pushLog(human.name+' eligió perder 2 seguidores (Cambio de Términos)'); }
  else { human.etica=Math.max(0,human.etica-2); pushLog(human.name+' eligió perder 2 ética (Cambio de Términos)'); }
  state.termsChoicePending = false;
  checkWinLoss();
  render();
}

/* ============================ EFECTOS DE CARTAS ============================ */
function applyDelta(player, effect, mult, log, name){
  if(!effect) return 0;
  let totalApplied = 0;
  if(effect.seguidores){ const d=Math.round(effect.seguidores*mult); const before=player.seguidores; player.seguidores=Math.max(0,player.seguidores+d); const applied=player.seguidores-before; log.push(name+': '+fmtSigned(applied)+' seguidores'); totalApplied+=Math.abs(applied) * (applied<0?-1:1); }
  if(effect.etica){ const d=Math.round(effect.etica*mult); const before=player.etica; player.etica=Math.max(0,player.etica+d); const applied=player.etica-before; log.push(name+': '+fmtSigned(applied)+' ética'); if(applied<0) return -1; }
  return 0;
}

function resolveAttackEffect(cardKey, actor, target, log){
  const card = CARD_DEFS[cardKey];
  const roll = rollDie();
  const outcome = card.dice==='special' ? (roll<=3?'rebound':'full') : (roll<=2?'rebound':(roll<=4?'half':'full'));
  let halfPenalty = 1;
  if(actor.flags.halfNextCard){ halfPenalty = 0.5; actor.flags.halfNextCard=false; log.push('(Sabotaje previo: efecto de '+actor.name+' reducido a la mitad)'); }
  if(card.special==='sabotaje'){
    const victim = outcome==='rebound' ? actor : target;
    victim.flags.halfNextCard = true;
    log.push((outcome==='rebound'?'¡Rebote! '+actor.name:target.name)+' sufrirá la mitad de efecto en su próxima carta.');
  } else if(card.special==='doxxing'){
    const victim = outcome==='rebound' ? actor : target;
    if(victim.faceDown.length){ const idx=Math.floor(Math.random()*victim.faceDown.length); log.push('Se reveló que '+victim.name+' tenía boca abajo: '+CARD_DEFS[victim.faceDown[idx].key].name); }
    else { log.push('No había cartas boca abajo que revelar.'); }
  } else if(card.special==='bots'){
    const magnitude = target.faceDown.length*2;
    if(magnitude===0){ log.push('El objetivo no tiene cartas boca abajo: sin efecto.'); }
    else if(outcome==='rebound'){ applyDelta(actor, {seguidores:-magnitude}, halfPenalty, log, actor.name); }
    else { const mult=(outcome==='half'?0.5:1)*halfPenalty; applyDelta(target, {seguidores:-magnitude}, mult, log, target.name); }
  } else {
    if(outcome==='rebound'){ applyDelta(actor, card.primary, halfPenalty, log, actor.name); }
    else { const mult=(outcome==='half'?0.5:1)*halfPenalty; applyDelta(target, card.primary, mult, log, target.name); }
    applyDelta(actor, card.secondary, 1, log, actor.name);
  }
  return { roll, outcome };
}

/* ---- Modo Identificado / Anónimo: para cartas de ataque con costo de ética impreso ---- */
const ATTACK_COST_CARDS = ['filtracion','suplantacion','toxico'];
function resolveIdentifiedAnonymous(cardKey, actor, target, mode, log){
  const card = CARD_DEFS[cardKey];
  const roll = rollDie();
  let halfPenalty = 1;
  if(actor.flags.halfNextCard){ halfPenalty = 0.5; actor.flags.halfNextCard=false; log.push('(Sabotaje previo: efecto reducido a la mitad)'); }
  let outcome;
  if(mode==='identificado'){
    outcome = roll<=3 ? 'half' : 'full';
    const mult = (outcome==='half'?0.5:1) * halfPenalty;
    applyDelta(target, card.primary, mult, log, target.name);
    applyDelta(actor, card.secondary, 1, log, actor.name);
    log.push('📛 Modo Identificado: pagas el costo de ética de la carta.');
  } else {
    if(roll<=3){
      outcome = 'identificado';
      applyDelta(actor, card.primary, halfPenalty, log, actor.name);
      log.push('😳 Te identificaron: el efecto completo cae sobre ti en vez de tu objetivo.');
    } else {
      outcome = 'anonimo';
      applyDelta(target, card.primary, halfPenalty, log, target.name);
      const debt = Math.abs((card.secondary && card.secondary.etica) || 0);
      actor.deudaAnonima = (actor.deudaAnonima||0) + debt;
      log.push('🕶️ El anonimato funcionó: no pagas nada ahora, pero sumas '+debt+' de deuda anónima.');
    }
  }
  return { roll, outcome, mode };
}
function getEthicsTier(etica){
  if(etica <= 2) return 'baja';
  if(etica >= 10) return 'alta';
  return 'media';
}
const ETHICS_EMOJI = { baja:'😠', media:'😐', alta:'😇' };
function checkEthicsTierChange(p){
  const tier = getEthicsTier(p.etica);
  if(p.ethicsTier === tier) return;
  const prev = p.ethicsTier;
  p.ethicsTier = tier;
  if(tier==='baja'){ pushLog('😠 '+p.name+': tus seguidores empiezan a desconfiar de ti. Tus cartas de Beneficio rendirán menos mientras tu ética esté tan baja.'); if(p.id===HUMAN_INDEX) state.toast = '😠 Tu mala reputación está espantando a los patrocinadores.'; }
  else if(tier==='alta'){ pushLog('😇 '+p.name+': te has ganado una reputación intachable. Tus cartas de Comunidad rendirán más mientras la mantengas.'); if(p.id===HUMAN_INDEX) state.toast = '😇 Tu buena reputación potencia tus colaboraciones.'; }
  else if(prev==='baja'){ pushLog('🙂 '+p.name+': tu reputación se está recuperando.'); }
  else if(prev==='alta'){ pushLog('😐 '+p.name+': tu reputación intachable empieza a diluirse.'); }
}
function resolveBenefitEffect(cardKey, actor, log){
  const card = CARD_DEFS[cardKey];
  const roll = rollDie();
  const outcome = roll<=3 ? 'half':'full';
  let mult = outcome==='half'?0.5:1;
  if(actor.flags.halfNextCard){ mult*=0.5; actor.flags.halfNextCard=false; log.push('(Sabotaje previo: reducido a la mitad)'); }
  if(getEthicsTier(actor.etica)==='baja' && card.primary && card.primary.seguidores){
    mult *= 0.6;
    log.push('(reputación baja: los patrocinadores desconfían, efecto reducido)');
  }
  applyDelta(actor, card.primary, mult, log, actor.name);
  applyDelta(actor, card.secondary, 1, log, actor.name);
  return { roll, outcome };
}
function resolveComunidadEffect(cardKey, actor, target, log){
  const card = CARD_DEFS[cardKey];
  let mult = state.roundFlags.comunidadDouble ? 2 : 1;
  const highRep = getEthicsTier(actor.etica)==='alta';
  if(highRep) mult *= 1.5;
  if(card.both){ applyDelta(actor, card.both, mult, log, actor.name); if(target) applyDelta(target, card.both, mult, log, target.name); }
  else if(card.other && target){ applyDelta(target, card.other, mult, log, target.name); }
  if(highRep) log.push('(reputación alta: tu buena fama potencia la colaboración)');
  if(state.roundFlags.comunidadBonus){ wildcardGrant(actor, 2); log.push(actor.name+' gana 2 fichas blancas extra (Reto Viral Positivo)'); }
}

function isCardBlocked(cardKey){
  const card = CARD_DEFS[cardKey];
  if(state.roundFlags.noAttacks && card.cat==='ataque') return true;
  if(state.roundFlags.blockedCard && cardKey===state.roundFlags.blockedCard) return true;
  return false;
}

/* ============================ TURNO HUMANO ============================ */
function previewCard(handIdx){
  if(state.phase!=='HUMAN_TURN') return;
  state.previewCard = handIdx;
  render();
}
function closePreview(){ state.previewCard=null; render(); }

function playFaceUp(handIdx){
  const human = state.players[HUMAN_INDEX];
  const card = human.hand[handIdx];
  const def = CARD_DEFS[card.key];
  if(def.cat==='defensa') return; // las de defensa solo van boca abajo
  if(def.cat==='ataque' || def.cat==='comunidad'){
    state.targetPick = { handIdx, mode:'play' };
    state.previewCard = null;
    render();
    return;
  }
  human.hand.splice(handIdx,1);
  const log = [];
  const res = resolveBenefitEffect(card.key, human, log);
  state.discard.push(card);
  finishHumanAction(card, def, log, res);
}
function placeFaceDown(handIdx){
  const human = state.players[HUMAN_INDEX];
  if(human.faceDown.length>=2) return;
  const card = human.hand.splice(handIdx,1)[0];
  const def = CARD_DEFS[card.key];
  human.faceDown.push(card);
  state.previewCard = null;
  state.turnActionsUsed++;
  if(def.cat==='defensa'){
    const attackName = CARD_DEFS[def.counters].name;
    state.defenseInfoModal = { cardName: def.name, attackName };
  } else {
    state.toast = 'Colocaste "'+def.name+'" boca abajo. Actívala cuando quieras tocándola.';
    setTimeout(()=>{ state.toast=null; render(); }, 2600);
  }
  render();
  checkWinLoss();
}
function closeDefenseInfo(){ state.defenseInfoModal = null; render(); }
function chooseTarget(targetId){
  const human = state.players[HUMAN_INDEX];
  const target = state.players[targetId];
  if(state._activatingFaceDownCard){
    const card = state._activatingFaceDownCard;
    const def = CARD_DEFS[card.key];
    if(def.cat==='ataque' && ATTACK_COST_CARDS.includes(card.key)){
      state._activatingFaceDownCard = null;
      state.targetPick = null;
      state.pendingAttackChoice = { card, def, target };
      render();
      return;
    }
    const log = [];
    if(def.cat==='ataque'){
      const res = resolveAttackEffect(card.key, human, target, log);
      state.discard.push(card);
      state.diceResult = { card, def, log, dice: res };
    } else {
      resolveComunidadEffect(card.key, human, target, log);
      state.discard.push(card);
      state.diceResult = { card, def, log, dice: null };
    }
    human.lastPlayed = card;
    state._activatingFaceDownCard = null;
    state.targetPick = null;
    state.phase = 'DICE_RESULT';
    render();
    if(state.diceResult.dice) setTimeout(animateDie, 50);
    checkWinLoss();
    return;
  }
  const tp = state.targetPick;
  const card = human.hand[tp.handIdx];
  const def = CARD_DEFS[card.key];
  if(def.cat==='ataque' && ATTACK_COST_CARDS.includes(card.key)){
    human.hand.splice(tp.handIdx,1);
    state.targetPick = null;
    state.pendingAttackChoice = { card, def, target };
    render();
    return;
  }
  human.hand.splice(tp.handIdx,1);
  const log = [];
  if(def.cat==='ataque'){
    const res = resolveAttackEffect(card.key, human, target, log);
    state.discard.push(card);
    state.targetPick = null;
    finishHumanAction(card, def, log, res);
  } else {
    resolveComunidadEffect(card.key, human, target, log);
    state.discard.push(card);
    state.targetPick = null;
    finishHumanAction(card, def, log, null);
  }
}
function chooseAttackMode(mode){
  const pending = state.pendingAttackChoice;
  const human = state.players[HUMAN_INDEX];
  const log = [];
  const res = resolveIdentifiedAnonymous(pending.card.key, human, pending.target, mode, log);
  state.discard.push(pending.card);
  state.pendingAttackChoice = null;
  finishHumanAction(pending.card, pending.def, log, res);
}
function finishHumanAction(card, def, log, diceResult){
  state.players[HUMAN_INDEX].lastPlayed = card;
  state.diceResult = { card, def, log, dice: diceResult };
  state.turnActionsUsed++;
  state.phase = 'DICE_RESULT';
  render();
  if(diceResult) setTimeout(animateDie, 50);
  checkWinLoss();
}
function closeDiceResult(){
  state.diceResult = null;
  state.phase = 'HUMAN_TURN';
  render();
}
function activateFaceDown(idx){
  const human = state.players[HUMAN_INDEX];
  const card = human.faceDown[idx];
  const def = CARD_DEFS[card.key];
  if(def.cat==='defensa'){
    state.toast = '🔒 '+def.name+' es reactiva: se activa sola cuando te atacan, no puedes jugarla manualmente.';
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 2600);
    return;
  }
  if(def.cat==='ataque' || def.cat==='comunidad'){
    human.faceDown.splice(idx,1);
    state._activatingFaceDownCard = card;
    render();
    return;
  }
  human.faceDown.splice(idx,1);
  const log = [];
  const res = resolveBenefitEffect(card.key, human, log);
  state.discard.push(card);
  human.lastPlayed = card;
  state.diceResult = { card, def, log, dice: res };
  state.phase = 'DICE_RESULT';
  render();
  setTimeout(animateDie, 50);
  checkWinLoss();
}
function endHumanTurn(){ startAITurns(); }

/* ============================ IA ============================ */
function startAITurns(){
  state.aiTurnQueue = [1,2,3];
  processNextAITurn();
}
function aiPickCard(ai){
  const playable = ai.hand.filter(c => CARD_DEFS[c.key].cat!=='defensa' && !isCardBlocked(c.key));
  if(!playable.length) return null;
  const attacks = playable.filter(c=>CARD_DEFS[c.key].cat==='ataque');
  const benefits = playable.filter(c=>CARD_DEFS[c.key].cat==='beneficio');
  const comunidad = playable.filter(c=>CARD_DEFS[c.key].cat==='comunidad');
  const r = Math.random();
  if(attacks.length && r<0.4) return attacks[Math.floor(Math.random()*attacks.length)];
  if(benefits.length && r<0.75) return benefits[Math.floor(Math.random()*benefits.length)];
  if(comunidad.length) return comunidad[Math.floor(Math.random()*comunidad.length)];
  return playable[Math.floor(Math.random()*playable.length)];
}
function aiPickTarget(ai, card){
  const others = state.players.filter(p=>p!==ai && !p.bustedOut && !p.won);
  if(!others.length) return null;
  if(card.key==='bots' || card.key==='doxxing') return state.players[HUMAN_INDEX];
  const human = state.players[HUMAN_INDEX];
  if(!human.bustedOut && !human.won && Math.random()<0.65) return human;
  return others[Math.floor(Math.random()*others.length)];
}
function processNextAITurn(){
  while(state.aiTurnQueue.length){
    const idx = state.aiTurnQueue[0];
    const ai = state.players[idx];
    if(ai.bustedOut || ai.won){ state.aiTurnQueue.shift(); continue; }
    const card = aiPickCard(ai);
    if(card){
      const def = CARD_DEFS[card.key];
      const cardIdx = ai.hand.findIndex(c=>c.uid===card.uid);
      if(def.cat==='beneficio'){
        ai.hand.splice(cardIdx,1);
        const log = [];
        resolveBenefitEffect(card.key, ai, log);
        state.discard.push(card);
        ai.lastPlayed = card;
        if(log.length) pushLog('💰 '+ai.name+' jugó '+def.name+': '+log.join(', '));
      } else {
        const target = aiPickTarget(ai, def);
        if(!target){ state.aiTurnQueue.shift(); continue; }
        ai.hand.splice(cardIdx,1);
        if(def.cat==='ataque'){
          const hasDefense = target.id===HUMAN_INDEX && target.faceDown.some(c=>CARD_DEFS[c.key].counters===card.key);
          if(hasDefense){
            state.phase = 'DEFENSE_PROMPT';
            state.defensePrompt = { aiIdx:idx, cardKey:card.key, targetId:target.id };
            render();
            return; // se detiene aquí: el humano decide AL INSTANTE si se defiende
          }
          const log = [];
          const res = ATTACK_COST_CARDS.includes(card.key)
            ? resolveIdentifiedAnonymous(card.key, ai, target, 'identificado', log)
            : resolveAttackEffect(card.key, ai, target, log);
          state.discard.push(card);
          ai.lastPlayed = card;
          pushLog('⚔️ '+ai.name+' usó '+def.name+' contra '+target.name+' (dado '+res.roll+', '+res.outcome+'): '+log.join(', '));
        } else {
          const log = [];
          resolveComunidadEffect(card.key, ai, target, log);
          state.discard.push(card);
          ai.lastPlayed = card;
          pushLog('🤝 '+ai.name+' usó '+def.name+' con '+target.name+': '+log.join(', '));
        }
      }
    }
    state.aiTurnQueue.shift();
    if(checkWinLoss()) return;
  }
  endRound();
}
function resolveDefensePrompt(useDefense){
  const dp = state.defensePrompt;
  const ai = state.players[dp.aiIdx];
  const human = state.players[HUMAN_INDEX];
  const def = CARD_DEFS[dp.cardKey];
  if(useDefense){
    const didx = human.faceDown.findIndex(c=>CARD_DEFS[c.key].counters===dp.cardKey);
    const defCard = human.faceDown.splice(didx,1)[0];
    state.discard.push(defCard);
    human.lastPlayed = defCard;
    const log = [];
    if(dp.cardKey==='filtracion'){
      applyDelta(ai, CARD_DEFS['filtracion'].primary, 1, log, ai.name);
      applyDelta(ai, CARD_DEFS['filtracion'].secondary, 1, log, ai.name);
    } else if(dp.cardKey==='funa'){
      applyDelta(ai, {etica:-2}, 1, log, ai.name);
    }
    pushLog('🛡️ '+human.name+' anuló '+def.name+' con '+CARD_DEFS[defCard.key].name+(log.length?': '+log.join(', '):''));
    state.toast = '🛡️ Anulaste el ataque con '+CARD_DEFS[defCard.key].name+'.';
  } else {
    const log = [];
    const res = ATTACK_COST_CARDS.includes(dp.cardKey)
      ? resolveIdentifiedAnonymous(dp.cardKey, ai, human, 'identificado', log)
      : resolveAttackEffect(dp.cardKey, ai, human, log);
    ai.lastPlayed = { key: dp.cardKey };
    pushLog('⚔️ '+ai.name+' usó '+def.name+' contra '+human.name+' (dado '+res.roll+', '+res.outcome+'): '+log.join(', '));
    state.toast = ai.name+' te atacó con '+def.name+'.';
  }
  state.defensePrompt = null;
  state.aiTurnQueue.shift();
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 2600);
  if(!checkWinLoss()) processNextAITurn();
}

/* ============================ FIN DE RONDA / PARTIDA ============================ */
function endRound(){
  state.players.forEach(p=>{ if(!p.bustedOut && !p.won) refillHand(p); });
  state.roundResult = { round: state.round, log: state.roundLog.slice() };
  state.phase = 'ROUND_RESULT';
  render();
}
function nextRound(){ startRound(); }

function checkWinLoss(){
  state.players.forEach(p=>{ if(!p.bustedOut && !p.won) checkEthicsTierChange(p); });
  state.players.forEach(p=>{
    if(!p.bustedOut && !p.won && p.seguidores<=0 && p.etica<=0){ p.bustedOut = true; }
  });
  state.players.forEach(p=>{
    if(!p.bustedOut && !p.won && (p.seguidores+p.etica) >= state.mode.goal){ p.won = true; }
  });
  const winner = state.players.find(p=>p.won);
  if(winner){ endMatch('goal', winner); return true; }
  const active = activePlayers();
  if(active.length<=1){
    endMatch('lastStanding', active[0] || null);
    return true;
  }
  return false; // el juego sigue: alguien pudo quedar eliminado sin que la partida termine
}
function endMatch(reason, winner){
  state.phase = 'MATCH_END';
  state.winnerInfo = { reason, winner };
  render();
}

/* ============================ DADO VISUAL ============================ */
function animateDie(){
  const el = document.getElementById('mesa-die');
  if(!el) return;
  let count=0;
  const iv = setInterval(()=>{
    el.textContent = DIE_FACES[Math.floor(Math.random()*6)];
    count++;
    if(count>10){ clearInterval(iv); const dr = state.diceResult && state.diceResult.dice; if(dr) el.textContent = DIE_FACES[dr.roll-1]; }
  }, 70);
}

/* ============================ RENDER: CARTAS ============================ */
function acardHtml(card, size, opts){
  opts = opts || {};
  const def = CARD_DEFS[card.key];
  const meta = CAT_META[def.cat];
  const cls = ['acard']; if(size) cls.push(size); if(opts.disabled) cls.push('disabled');
  const onclick = opts.onclick ? ' onclick="'+opts.onclick+'"' : '';
  const title = ' title="'+def.name+'"';
  const icon = CARD_ICON_SVG[card.key] || def.icon;
  return '<div class="'+cls.join(' ')+'" style="--ac:'+meta.color+'"'+onclick+title+'>'
    + '<div class="acard-icon">'+icon+'</div>'
    + '<div class="acard-name">'+def.name+'</div>'
    + '<div class="acard-cat">'+meta.label+'</div>'
    + '</div>';
}
function abackHtml(mini, variant, opts){
  opts = opts || {};
  variant = variant || 'hand';
  const icon = variant==='facedown' ? '🔒' : '🎴';
  const onclick = opts.onclick ? ' onclick="'+opts.onclick+'"' : '';
  return '<div class="aback'+(mini?' mini':'')+' variant-'+variant+'"'+onclick+'>'+icon+'</div>';
}

function renderSeat(p, idx){
  const isHuman = idx===HUMAN_INDEX;
  const cls = ['seat']; cls.push(isHuman?'human':'ai');
  if(p.bustedOut) cls.push('out');
  if(p.won) cls.push('won');
  const eticaPct = Math.max(0, Math.min(100, (p.etica/state.mode.goal)*100));
  const segPct = Math.max(0, Math.min(100, (p.seguidores/state.mode.goal)*100));

  let handHtml = '';
  if(isHuman && state.phase==='HUMAN_TURN'){
    handHtml += '<div class="hand-row">';
    p.hand.forEach((c,i)=>{ const blocked=isCardBlocked(c.key); handHtml += acardHtml(c,'xl',{disabled:blocked, onclick: blocked?'':'previewCard('+i+')'}); });
    handHtml += '</div>';
  } else if(!isHuman){
    handHtml += '<div class="hand-label">MANO ('+p.hand.length+')</div><div class="hand-row">';
    p.hand.forEach(()=>{ handHtml += abackHtml(true, 'hand'); });
    handHtml += '</div>';
  } else {
    handHtml += '<div class="hand-row">';
    p.hand.forEach((c)=>{ handHtml += acardHtml(c,'mini'); });
    handHtml += '</div>';
  }

  let fdHtml = '';
  if(p.faceDown.length){
    fdHtml = '<div class="facedown-label">BOCA ABAJO ('+p.faceDown.length+'/2)</div><div class="facedown-row">';
    p.faceDown.forEach((c,i)=>{
      if(isHuman){ fdHtml += acardHtml(c,'mini', { onclick: state.phase==='HUMAN_TURN' ? 'activateFaceDown('+i+')' : '' }); }
      else { fdHtml += abackHtml(true, 'facedown'); }
    });
    fdHtml += '</div>';
  }

  let lastPlayedHtml = '';
  if(p.lastPlayed){
    lastPlayedHtml = '<div class="facedown-label">ÚLTIMA CARTA JUGADA</div><div class="facedown-row">'+acardHtml(p.lastPlayed,'mini')+'</div>';
  }

  const flags = [];
  if(p.flags.halfNextCard) flags.push('⚠️ Próxima carta a mitad de efecto');
  if(p.deudaAnonima>0) flags.push('🕶️ Deuda anónima: '+p.deudaAnonima);
  const flagsHtml = flags.length ? '<div class="flag-row">'+flags.map(f=>'<span class="flag-chip">'+f+'</span>').join('')+'</div>' : '';

  let statusTag = '';
  if(p.won) statusTag = ' 🏆';
  if(p.bustedOut) statusTag = ' ❌';

  return '<div class="'+cls.join(' ')+'">'
    + '<div class="seat-head"><div class="seat-name"><span style="width:9px;height:9px;border-radius:50%;background:'+p.color+';display:inline-block;"></span>'+p.name+statusTag+'</div></div>'
    + '<div class="stat-line"><span class="stat-label">👥 Seguidores</span><span class="led">'+p.seguidores+'</span></div>'
    + '<div class="bar"><div class="bar-fill" style="width:'+segPct+'%; background:var(--cyan);"></div></div>'
    + '<div class="stat-line" style="margin-top:4px;"><span class="stat-label">⚖️ Ética '+(ETHICS_EMOJI[p.ethicsTier]||'😐')+'</span><span class="led">'+p.etica+'</span></div>'
    + '<div class="bar"><div class="bar-fill" style="width:'+eticaPct+'%; background:var(--pos);"></div></div>'
    + handHtml + fdHtml + lastPlayedHtml + flagsHtml
    + '</div>';
}

function renderTurnBar(){
  if(state.phase!=='HUMAN_TURN') return '';
  return '<div class="turn-counter">Acciones jugadas esta ronda: '+state.turnActionsUsed+' / 4 (máx. 2 boca abajo a la vez)</div>'
    + '<button class="end-turn-btn" onclick="endHumanTurn()">Terminar mi turno →</button>';
}

function renderEventModal(){
  if(state.phase!=='EVENT_REVEAL' || !state.activeEvent) return '';
  const ev = state.activeEvent;
  return '<div class="overlay"><div class="modal">'
    + '<div class="eyebrow">EVENTO — RONDA '+state.round+'/'+state.mode.rounds+'</div>'
    + '<div class="ecard"><div class="eyebrow">EVENTO</div><div class="icon">'+(EVENT_ICON_SVG[ev.key]||ev.icon)+'</div><h3>'+ev.title+'</h3><p>'+ev.text+'</p></div>'
    + (state.roundLog.length ? '<div class="result-log">'+state.roundLog.join('<br>')+'</div>' : '')
    + (state.termsChoicePending ? '<div class="modal-actions"><button class="start-btn" onclick="resolveTermsChoice(\'seguidores\')">Perder 2 Seguidores</button><button class="start-btn" onclick="resolveTermsChoice(\'etica\')">Perder 2 Ética</button></div>'
       : '<button class="start-btn" onclick="continueAfterEvent()">Continuar →</button>')
    + '</div></div>';
}

function renderWildcardModal(){
  if(!state.wildcardPick) return '';
  const w = state.wildcardPick;
  return '<div class="overlay"><div class="modal">'
    + '<div class="eyebrow">FICHAS BLANCAS</div><h2>'+w.player.name+' ganó '+w.n+' fichas blancas</h2>'
    + '<p>Repártelas entre Seguidores y Ética.</p>'
    + '<div class="wc-row"><button class="wc-btn" onclick="adjustWildcardPick(-1)">−</button><div class="led" style="font-size:16px;">'+w.seg+' seguidores / '+(w.n-w.seg)+' ética</div><button class="wc-btn" onclick="adjustWildcardPick(1)">+</button></div>'
    + '<button class="start-btn" onclick="confirmWildcardPick()">Confirmar</button>'
    + '</div></div>';
}

function renderAttackModeModal(){
  if(!state.pendingAttackChoice) return '';
  const p = state.pendingAttackChoice;
  const cost = Math.abs((p.card.secondary && p.card.secondary.etica) || 0);
  let html = '<div class="overlay"><div class="modal">';
  html += '<div class="eyebrow">¿CÓMO PUBLICAS ESTE ATAQUE?</div>';
  html += '<h2>'+p.def.icon+' '+p.def.name+' contra '+p.target.name+'</h2>';
  html += '<button class="choice-btn" onclick="chooseAttackMode(\'identificado\')"><div class="c-label">📛 Identificado</div><div class="c-effects">Pagas '+cost+' de ética siempre. Dado: 1-3 mitad de efecto, 4-6 efecto completo sobre '+p.target.name+'.</div></button>';
  html += '<button class="choice-btn" onclick="chooseAttackMode(\'anonimo\')"><div class="c-label">🕶️ Anónimo</div><div class="c-effects">No pagas nada ahora. Dado: 1-3 te identifican y el efecto completo te cae a TI, 4-6 el anonimato funciona (efecto completo sobre '+p.target.name+', pero sumas '+cost+' de deuda anónima para pagar después).</div></button>';
  html += '</div></div>';
  return html;
}

function renderPreviewModal(){
  if(state.previewCard===null || state.phase!=='HUMAN_TURN') return '';
  const human = state.players[HUMAN_INDEX];
  const idx = state.previewCard;
  const card = human.hand[idx];
  if(!card) return '';
  const def = CARD_DEFS[card.key];
  const canPlayUp = def.cat!=='defensa';
  const canGoDown = human.faceDown.length<2;
  let html = '<div class="overlay"><div class="modal"><div class="eyebrow">VISTA PREVIA</div>';
  html += acardHtml(card,'preview');
  html += '<p style="margin-top:10px;">'+def.desc+'</p>';
  html += '<div class="modal-actions">';
  if(canPlayUp) html += '<button class="start-btn" onclick="playFaceUp('+idx+')">▶️ Jugar boca arriba</button>';
  html += '</div><div class="modal-actions">';
  html += '<button class="start-btn down-btn" '+(canGoDown?'':'disabled')+' onclick="placeFaceDown('+idx+')">🔒 Dejar boca abajo ('+human.faceDown.length+'/2)</button>';
  html += '<button class="start-btn cancel-btn" onclick="closePreview()">Cancelar</button>';
  html += '</div></div></div>';
  return html;
}

function renderTargetModal(){
  if(!state.targetPick && !state._activatingFaceDownCard) return '';
  const human = state.players[HUMAN_INDEX];
  const card = state._activatingFaceDownCard ? state._activatingFaceDownCard : human.hand[state.targetPick.handIdx];
  if(!card) return '';
  const def = CARD_DEFS[card.key];
  let html = '<div class="overlay"><div class="modal"><div class="eyebrow">ELEGIR OBJETIVO</div><h2>'+def.icon+' '+def.name+'</h2><p>'+def.desc+'</p><div class="target-row">';
  state.players.forEach((pl,i)=>{ if(i!==HUMAN_INDEX && !pl.bustedOut && !pl.won) html += '<button class="target-btn" onclick="chooseTarget('+i+')">'+pl.name+'</button>'; });
  html += '</div></div></div>';
  return html;
}

function renderDiceResultModal(){
  if(state.phase!=='DICE_RESULT' || !state.diceResult) return '';
  const r = state.diceResult;
  let html = '<div class="overlay"><div class="modal"><div class="eyebrow">RESULTADO</div>';
  html += '<h2>'+r.def.icon+' '+r.def.name+'</h2>';
  if(r.dice){
    html += '<div class="mesa" style="margin:14px auto;"><div class="mesa-die" id="mesa-die">'+DIE_FACES[0]+'</div><div class="mesa-die-label">DADO: '+r.dice.roll+' → '+r.dice.outcome.toUpperCase()+'</div></div>';
  }
  if(r.log.length) html += '<div class="result-log">'+r.log.join('<br>')+'</div>';
  html += '<button class="start-btn" onclick="closeDiceResult()">Continuar →</button></div></div>';
  return html;
}

function renderDefensePromptModal(){
  if(state.phase!=='DEFENSE_PROMPT' || !state.defensePrompt) return '';
  const dp = state.defensePrompt;
  const ai = state.players[dp.aiIdx];
  const attackDef = CARD_DEFS[dp.cardKey];
  const human = state.players[HUMAN_INDEX];
  const defCard = human.faceDown.find(c=>CARD_DEFS[c.key].counters===dp.cardKey);
  const defDef = CARD_DEFS[defCard.key];
  return '<div class="overlay"><div class="modal">'
    + '<div class="eyebrow">⚔️ ¡TE ATACARON!</div>'
    + '<h2>'+ai.name+' usó '+attackDef.icon+' '+attackDef.name+' contra ti</h2>'
    + '<p>'+attackDef.desc+'</p>'
    + '<p>Tienes <b>'+defDef.name+'</b> boca abajo. ¿La usas ahora mismo, antes de que se resuelva el resto de la ronda?</p>'
    + '<div class="modal-actions"><button class="start-btn" onclick="resolveDefensePrompt(true)">🛡️ Sí, defenderme ahora</button></div>'
    + '<div class="modal-actions"><button class="start-btn cancel-btn" onclick="resolveDefensePrompt(false)">No, dejar que me afecte</button></div>'
    + '</div></div>';
}

function renderDefenseInfoModal(){
  if(!state.defenseInfoModal) return '';
  const d = state.defenseInfoModal;
  return '<div class="overlay"><div class="modal">'
    + '<div class="eyebrow">🔒 CARTA DE DEFENSA LISTA</div>'
    + '<h2>'+d.cardName+'</h2>'
    + '<p>No hagas nada más con ella por ahora. Se activa <b>sola, automáticamente</b>, en el instante exacto en que alguien intente usar <b>'+d.attackName+'</b> contra ti — el juego se detendrá y te preguntará ahí mismo si quieres usarla. Si nadie te ataca con esa carta, se queda guardada esperando.</p>'
    + '<button class="start-btn" onclick="closeDefenseInfo()">Entendido →</button>'
    + '</div></div>';
}

function renderHowToPlayModal(){
  if(!state.howToPlay) return '';
  return '<div class="overlay"><div class="modal">'
    + '<div class="eyebrow">¿CÓMO SE JUEGA?</div><h2>El ciclo de cada ronda</h2>'
    + '<div class="result-log" style="text-align:left;">'
    + '1️⃣ Se revela un <b>Evento</b> (te afecta a ti y a las IA por igual, cada 2 rondas).<br>'
    + '2️⃣ Si tienes <b>Cartas Estrella</b>, puedes usarlas antes de jugar.<br>'
    + '3️⃣ Tocas una carta de tu mano → eliges <b>jugarla boca arriba</b> (efecto inmediato, con dado si aplica) o <b>dejarla boca abajo</b> (la guardas, máx. 2).<br>'
    + '4️⃣ Repites hasta 4 veces, o presionas "Terminar mi turno".<br>'
    + '5️⃣ Las 3 IA juegan sus cartas boca arriba, una por una. Si te atacan y tienes la Defensa exacta boca abajo, el juego te pregunta al instante si quieres usarla.<br>'
    + '6️⃣ Fin de ronda: todos reponen su mano a 5 cartas y empieza la siguiente.<br><br>'
    + '<b>La meta:</b> llegar a '+(state.mode?state.mode.goal:45)+' fichas (Seguidores + Ética juntos) antes que los demás, sin quedarte nunca en 0 y 0 a la vez.'
    + '</div>'
    + '<button class="start-btn" onclick="closeHowToPlay()">Entendido →</button>'
    + '</div></div>';
}
function toggleHowToPlay(){ state.howToPlay = !state.howToPlay; render(); }
function closeHowToPlay(){ state.howToPlay = false; render(); }

function renderRoundResult(){
  if(state.phase!=='ROUND_RESULT' || !state.roundResult) return '';
  const r = state.roundResult;
  let html = '<div class="overlay"><div class="modal"><div class="eyebrow">FIN DE LA RONDA '+r.round+'/'+state.mode.rounds+'</div><h2>Resumen</h2>';
  html += r.log.length ? '<div class="result-log">'+r.log.join('<br>')+'</div>' : '<p>Ronda tranquila, sin eventos ni ataques registrados.</p>';
  html += '<button class="start-btn" onclick="nextRound()">'+(state.round>=state.mode.rounds?'Ver resultados finales →':'Siguiente ronda →')+'</button></div></div>';
  return html;
}

function renderEndScreen(){
  const w = state.winnerInfo;
  const ranked = [...state.players].sort((a,b)=> (b.seguidores+b.etica) - (a.seguidores+a.etica) || (b.etica-a.etica));
  const medals = ['🥇','🥈','🥉','🎗️'];
  let reasonText = '';
  if(w.reason==='goal') reasonText = w.winner.name+' alcanzó la meta de '+state.mode.goal+' fichas combinadas.';
  else if(w.reason==='lastStanding') reasonText = 'Todos los demás se quedaron sin fichas — '+ (w.winner?w.winner.name:'nadie') +' gana por ser el último en pie.';
  else reasonText = 'Se jugaron las '+state.mode.rounds+' rondas de la modalidad '+state.mode.label+'. Gana quien tenga más fichas combinadas (empate: más ética).';
  let html = '<div class="setup-wrap"><div class="setup-card">';
  html += '<h1>El costo de la <span class="g">fama</span></h1>';
  html += '<div class="setup-sub">'+reasonText+'</div>';
  html += '<div class="final-list">';
  ranked.forEach((p,i)=>{
    const total = p.seguidores + p.etica;
    html += '<div class="final-row '+(i===0?'rank1':'')+'"><div><span class="medal">'+(medals[i]||'')+'</span><b>'+p.name+'</b>'+(p.bustedOut?' <span class="mono" style="color:var(--neg); font-size:10px;">(sin fichas)</span>':'')+'</div><div class="led" style="color:var(--gold)">'+total+' fichas</div></div>';
  });
  html += '</div><button class="start-btn" onclick="showSetup()">Jugar otra partida</button></div></div>';
  return html;
}

function renderTable(){
  let html = '<div class="topbar"><div class="brand"><div class="brand-badge">📈</div><div class="brand-title display">INFLUENCER<br><span style="font-size:9px;">EL COSTO DE LA FAMA</span></div></div>'
    + '<span class="round-badge">Ronda '+state.round+'/'+state.mode.rounds+' · Modalidad '+state.mode.label+'</span>'
    + '<button class="info-btn" onclick="toggleHowToPlay()">❓ Cómo jugar</button>'
    + '<button class="info-btn" onclick="endMatch(\'manual\', null)">Terminar y ver resultados</button></div>';
  html += '<div class="table-wrap"><div class="grid">';
  html += '<div class="seat-top">'+renderSeat(state.players[2],2)+'</div>';
  html += '<div class="seat-left">'+renderSeat(state.players[1],1)+'</div>';
  html += '<div class="seat-right">'+renderSeat(state.players[3],3)+'</div>';
  html += '<div class="stage">';
  if(state.activeEvent && state.phase!=='EVENT_REVEAL'){ html += '<div class="event-banner"><div class="event-banner-icon">'+(EVENT_ICON_SVG[state.activeEvent.key]||state.activeEvent.icon)+'</div><span><b>'+state.activeEvent.title+'</b> — '+state.activeEvent.text+'</span></div>'; }
  html += renderTurnBar();
  html += '</div>';
  html += '<div class="seat-bottom">'+renderSeat(state.players[0],0)+'</div>';
  html += '</div></div>';
  html += renderEventModal();
  html += renderWildcardModal();
  html += renderPreviewModal();
  html += renderTargetModal();
  html += renderAttackModeModal();
  html += renderDiceResultModal();
  html += renderDefensePromptModal();
  html += renderDefenseInfoModal();
  html += renderHowToPlayModal();
  html += renderRoundResult();
  if(state.toast) html += '<div class="toast">'+state.toast+'</div>';
  return html;
}

function renderSetup(){
  let selectedMode = (state && state._pendingMode) || 'larga';
  let html = '<div class="topbar"><div class="brand"><div class="brand-badge">📈</div><div class="brand-title display">INFLUENCER<br><span style="font-size:9px;">EL COSTO DE LA FAMA</span></div></div><div></div></div>';
  html += '<div class="setup-wrap"><div class="setup-card">';
  html += '<h1>El costo de la <span class="g">fama</span></h1>';
  html += '<div class="setup-sub">4 jugadores: tú + 3 IA. Free for all, resolución inmediata, dado de por medio.</div>';
  html += '<div class="name-row"><span class="seat-swatch" style="background:'+SEAT_COLORS[0]+'"></span><input id="name0" placeholder="Tu nombre" maxlength="16"></div>';
  html += '<div class="mode-row">';
  Object.keys(MODES).forEach(k=>{
    const m = MODES[k];
    html += '<div class="mode-btn '+(k===selectedMode?'selected':'')+'" onclick="selectMode(\''+k+'\')"><b>'+m.label+'</b><span>'+m.rounds+' rondas · meta '+m.goal+' fichas</span></div>';
  });
  html += '</div>';
  html += '<button class="start-btn" onclick="onStart()">Comenzar partida</button>';
  html += '<div class="rules-box">'
    + '<b>Free for all:</b> cada jugador elige libremente a quién afecta su carta, con resolución inmediata (no es por turnos rígidos).<br>'
    + '<span class="sec">CARTAS BOCA ARRIBA / ABAJO</span>Boca arriba = efecto inmediato. Boca abajo = la activas cuando quieras (máx. 2 a la vez); las de Defensa SOLO funcionan boca abajo, y se activan solas como reacción instantánea si te atacan con la carta que anulan. <b>Ejemplo:</b> dejas "Cuenta Verificada" boca abajo; en cualquier momento posterior que un rival juegue "Suplantación de Identidad" contra ti, el juego se detiene y te pregunta ahí mismo si quieres usarla — no hace falta que hagas nada mientras tanto.'
    + '<span class="sec">DADO (D6)</span>Ataque: 1-2 rebota hacia ti, 3-4 mitad de efecto, 5-6 efecto completo. Beneficio: 1-3 mitad, 4-6 completo. El efecto secundario (si existe) siempre se aplica completo.'
    + '<span class="sec">IDENTIFICADO / ANÓNIMO</span>Filtración de Datos, Suplantación de Identidad y Comentario Tóxico (las que tienen costo de ética impreso) te dejan elegir cómo jugarlas: <b>Identificado</b> — pagas el costo siempre, dado 1-3 mitad / 4-6 completo sobre el objetivo. <b>Anónimo</b> — no pagas nada ahora, pero el dado decide: 1-3 te identifican y el efecto completo te cae a ti, 4-6 el anonimato funciona (efecto completo al objetivo) y sumas esa ética como "deuda anónima" pendiente. El evento Fin del Anonimato cobra la mitad de toda deuda acumulada.'
    + '<span class="sec">REPUTACIÓN</span>Tu ética no es solo un número: si baja a 2 o menos (😠), tus cartas de Beneficio rinden menos (los patrocinadores desconfían). Si sube a 10 o más (😇), tus cartas de Comunidad rinden más. El juego te avisa apenas cruzas esos umbrales.'
    + '<span class="sec">GANAR / PERDER</span>Te quedas sin Seguidores Y sin Ética a la vez → quedas eliminado. Llegas a la meta de fichas combinadas de la modalidad → ganas al instante. Si nadie llega, gana quien tenga más al final (empate: más ética).'
    + '<span class="sec">IA</span>Las IA siempre juegan boca arriba (nunca se defienden con cartas boca abajo) — son simples y algo explotables.'
    + '</div>';
  html += '</div></div>';
  return html;
}
function selectMode(k){
  if(!state) state = { screen:'setup' };
  state._pendingMode = k;
  render();
}

function render(){
  const app = document.getElementById('app');
  if(!state || state.screen==='setup'){ app.innerHTML = renderSetup(); return; }
  if(state.phase==='MATCH_END'){ app.innerHTML = '<div class="topbar"><div class="brand"><div class="brand-badge">📈</div><div class="brand-title display">INFLUENCER<br><span style="font-size:9px;">EL COSTO DE LA FAMA</span></div></div><div></div></div>' + renderEndScreen(); return; }
  app.innerHTML = renderTable();
}

/* ============================ UI HOOKS ============================ */
function showSetup(){ state = { screen:'setup', _pendingMode:'larga' }; render(); }
function onStart(){
  const name = document.getElementById('name0').value.trim();
  const modeKey = (state && state._pendingMode) || 'larga';
  startMatch(name, modeKey);
}

window.showSetup = showSetup;
window.onStart = onStart;
window.selectMode = selectMode;
window.continueAfterEvent = continueAfterEvent;
window.resolveTermsChoice = resolveTermsChoice;
window.adjustWildcardPick = adjustWildcardPick;
window.confirmWildcardPick = confirmWildcardPick;
window.previewCard = previewCard;
window.closePreview = closePreview;
window.playFaceUp = playFaceUp;
window.placeFaceDown = placeFaceDown;
window.chooseTarget = chooseTarget;
window.chooseAttackMode = chooseAttackMode;
window.activateFaceDown = activateFaceDown;
window.closeDiceResult = closeDiceResult;
window.endHumanTurn = endHumanTurn;
window.resolveDefensePrompt = resolveDefensePrompt;
window.closeDefenseInfo = closeDefenseInfo;
window.toggleHowToPlay = toggleHowToPlay;
window.closeHowToPlay = closeHowToPlay;
window.nextRound = nextRound;
window.endMatch = endMatch;

showSetup();
</script>
</body>
</html>
